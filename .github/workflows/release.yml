name: Build modified Windows edition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:electron
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: modified-windows-build
          path: artifacts/*.exe
